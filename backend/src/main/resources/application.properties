server.port=8080
server.error.include-message=always

spring.application.name=money-movement-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/moneyapp
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8

spring.cache.type=redis
spring.cache.redis.time-to-live=60s

spring.jackson.default-property-inclusion=non-null

jwt.secret=${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key-at-least-256-bits}
jwt.expiration-ms=86400000

app.initial-balance=100000
app.currency=BDT

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
